_target_: topobench.model.TBModel

model_name: sheafhypergcn
model_domain: hypergraph

feature_encoder:
  _target_: topobench.nn.encoders.${model.feature_encoder.encoder_name}
  encoder_name: AllCellFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}}
  out_channels: 64
  proj_dropout: 0.0

backbone:
  _target_: topobench.nn.backbones.hypergraph.sheaf_hypergcn.SheafHyperGCN
  in_channels: ${model.feature_encoder.out_channels}
  hidden_channels: ${model.feature_encoder.out_channels}
  out_channels: ${model.feature_encoder.out_channels}
  n_layers: 2
  d: 2 # stalk dimension (>1 required for OrthoSheafs / GeneralSheafs)
  sheaf_type: DiagSheafs # DiagSheafs | OrthoSheafs | GeneralSheafs
  dropout: 0.5
  init_hedge: avg
  sheaf_normtype: sym_block_norm
  sheaf_act: sigmoid
  sheaf_left_proj: false
  dynamic_sheaf: false
  sheaf_pred_block: MLP_var1
  sheaf_dropout: false
  sheaf_special_head: false
  AllSet_input_norm: true
  use_mediators: true
  orthogonal_map: cayley # cayley | matrix_exp (used only by OrthoSheafs)

backbone_wrapper:
  _target_: topobench.nn.wrappers.HypergraphWrapper
  _partial_: true
  wrapper_name: HypergraphWrapper
  out_channels: ${model.feature_encoder.out_channels}
  num_cell_dimensions: 1 # The highest order of cell dimensions to consider

readout:
  _target_: topobench.nn.readouts.${model.readout.readout_name}
  readout_name: PropagateSignalDown
  num_cell_dimensions: 1
  hidden_dim: ${model.feature_encoder.out_channels}
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${define_task_level:${dataset.parameters.task_level},${dataset.split_params.learning_setting}}
  pooling_type: sum

# compile model for faster training with pytorch 2.0
compile: false
